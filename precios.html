<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Precios de la tienda</title>
<!--
  Página para anotar a cuánto se vende cada producto (GEOPATRON · Calibrar el margen).
  No guarda ni manda datos a ningún servidor: la lista viaja en el enlace, después del «#», que el navegador nunca
  envía al servidor. Lo escrito se guarda solo en este celular (por si se cierra) y la respuesta se arma aquí mismo
  y se abre en WhatsApp para que la persona la mande.
-->
<style>
body{margin:0;background:#F4F1EC;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#1B1B1F}
.cab{background:#1F6F5C;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:2}
.cab small{opacity:.85}.cab h1{margin:2px 0 0;font-size:21px}.cab p{margin:6px 0 0;font-size:15px;opacity:.95}
.barra{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}
.barra i{display:block;height:100%;background:#fff;width:0}
.busca{display:block;margin:12px;width:calc(100% - 24px);box-sizing:border-box;font-size:16px;padding:11px 12px;border:1px solid #D9D4CB;border-radius:12px;background:#fff}
.grupo{margin:18px 14px 6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B6B73}
.prod{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:12px;align-items:center;border:2px solid transparent}
.prod.lleno{border-color:#1E9E5A}
.num{font-size:13px;color:#6B6B73;min-width:28px;text-align:right}
.txt{flex:1;min-width:0}
.nom{font-size:17px;font-weight:600;line-height:1.25}
.det{font-size:13.5px;color:#6B6B73;margin-top:2px}
.costo{font-size:14.5px;color:#1B1B1F;margin-top:4px}
.costo b{font-weight:700}
.gana{font-size:14px;font-weight:700;margin-top:3px}
.gana.bien{color:#1E9E5A}.gana.poco{color:#B7791F}.gana.mal{color:#C8473F}
.pre{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:700;color:#6B6B73}
.pre input{width:84px;font-size:20px;font-weight:700;padding:8px;border:2px solid #D9D4CB;border-radius:10px;text-align:right;color:#1B1B1F;background:#FAF8F5}
.pre input:focus{outline:none;border-color:#1F6F5C;background:#fff}
.lleno .pre input{border-color:#1E9E5A}
.no{font-size:13px;color:#8A6D1F;background:none;border:none;padding:4px 0 0;text-decoration:underline}
.prod.novende{opacity:.55}
.pie{text-align:center;color:#6B6B73;font-size:14px;margin:10px}
.env{position:sticky;bottom:0;display:block;margin:12px;width:calc(100% - 24px);font-size:18px;font-weight:700;color:#fff;background:#25D366;border:none;border-radius:14px;padding:16px 0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.error{margin:24px;font-size:16px}
</style>
</head>
<body>
<div class="cab"><small>Precios de la tienda</small><h1 id="titulo"></h1><p id="saludo"></p><div class="barra"><i id="avance"></i></div></div>
<input class="busca" id="busca" type="search" placeholder="Buscar producto…" style="display:none">
<div id="lista"></div>
<div class="pie" id="cuenta"></div>
<button class="env" id="mandar" style="display:none">Mandar mis precios por WhatsApp</button>
<div class="pie" id="nota" style="display:none">Puedes mandar los que lleves y seguir después: lo que escribas se queda guardado en este celular.</div>
<script>
// Datos en el enlace: #z<base64url de JSON comprimido (deflate)> o #<base64url de JSON> =
// {t: título, q: nombre, n: número de WhatsApp para la respuesta,
//  p: [[número, producto, presentación, categoría, costo por pieza con impuestos (opcional),
//       precio al público sugerido por el proveedor (opcional)], …]}
async function leer() {
  try {
    let h = location.hash.slice(1), z = h[0] === 'z';
    if (z) h = h.slice(1);
    let b = h.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    let bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
    if (z) {
      const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(s).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return null; }
}
let D = null, R = {}, CLAVE = '';
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(R)); } catch (e) {} }
function cargar() { try { R = JSON.parse(localStorage.getItem(CLAVE) || '{}') || {}; } catch (e) { R = {}; } }
function pesos(n) { return '$' + n.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function limpio(v) { const n = parseFloat(String(v).replace(',', '.').replace(/[^0-9.]/g, '')); return n > 0 ? n : null; }
function contar() {
  const n = D.p.filter(p => R[p[0]]).length;
  document.getElementById('cuenta').textContent = n + ' de ' + D.p.length + ' contestados';
  document.getElementById('avance').style.width = (100 * n / D.p.length) + '%';
}
function pintar() {
  const l = document.getElementById('lista'); l.innerHTML = '';
  const q = document.getElementById('busca').value.trim().toLowerCase();
  let prov = null;
  const visibles = D.p.filter(p => !q || p[1].toLowerCase().includes(q));
  visibles.forEach((p, i) => {
    const [k, nom, pres, pv, costo, sug] = p;
    if (pv && pv !== prov) { prov = pv; const g = document.createElement('div'); g.className = 'grupo'; g.textContent = pv; l.appendChild(g); }
    const d = document.createElement('div');
    d.className = 'prod' + (R[k] === 'X' ? ' novende' : R[k] ? ' lleno' : '');
    d.innerHTML = '<div class="num"></div><div class="txt"><div class="nom"></div><div class="det"></div>'
      + (costo ? '<div class="costo"></div><div class="gana"></div>' : '')
      + '<button class="no" type="button"></button></div><label class="pre">$<input inputmode="decimal" enterkeyhint="next" autocomplete="off"></label>';
    d.querySelector('.num').textContent = k;
    d.querySelector('.nom').textContent = nom;
    d.querySelector('.det').textContent = 'Precio por ' + (pres && pres !== 'pieza' ? 'pieza (viene en ' + pres + ')' : 'pieza');
    const piezas = parseInt((String(pres).match(/de (\d+)/) || [])[1] || '1', 10);
    const gana = d.querySelector('.gana');
    function verGana() {
      if (!gana) return;
      const v = limpio(inp.value);
      if (!v) { gana.textContent = ''; gana.className = 'gana'; return; }
      const g = v - costo, m = g / costo;
      gana.textContent = (g >= 0 ? 'Le ganas ' + pesos(g) : 'Pierdes ' + pesos(-g)) + ' por pieza (' + Math.round(m * 100) + ' %)';
      gana.className = 'gana ' + (m >= .2 ? 'bien' : m >= .1 ? 'poco' : 'mal');
    }
    if (costo) d.querySelector('.costo').innerHTML = 'Te cuesta <b>' + pesos(costo) + '</b> la pieza'
      + (piezas > 1 ? ' (' + pres + ' a ' + pesos(costo * piezas) + ')' : '')
      + (sug ? '<br>El proveedor sugiere venderlo a <b>' + pesos(sug) + '</b>' : '');
    const inp = d.querySelector('input'), no = d.querySelector('.no');
    inp.setAttribute('aria-label', 'Precio de ' + nom);
    inp.value = R[k] && R[k] !== 'X' ? R[k] : '';
    verGana();
    no.textContent = R[k] === 'X' ? 'Sí lo vendo' : 'Ya no lo vendo';
    inp.oninput = () => { const v = limpio(inp.value); if (v) R[k] = v; else delete R[k]; d.className = 'prod' + (v ? ' lleno' : ''); guardar(); contar(); verGana(); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const t = l.querySelectorAll('input'); const j = [...t].indexOf(inp); if (t[j + 1]) t[j + 1].focus(); else inp.blur(); } };
    no.onclick = () => { if (R[k] === 'X') delete R[k]; else R[k] = 'X'; guardar(); pintar(); };
    l.appendChild(d);
  });
  contar();
}
function mandar() {
  const con = D.p.filter(p => R[p[0]]);
  if (!con.length) { alert('Todavía no escribes ningún precio.'); return; }
  const precios = con.filter(p => R[p[0]] !== 'X').length, fuera = con.length - precios;
  let t = 'Precios de la tienda: ' + precios + ' de ' + D.p.length + (fuera ? ', ' + fuera + ' ya no los vendo' : '') + '\n';
  t += '[PRE ' + con.map(p => p[0] + '=' + R[p[0]]).join(' ') + ']';
  location.href = 'https://wa.me/' + (D.n || '') + '?text=' + encodeURIComponent(t);
}
(async () => {
  D = await leer();
  if (!D || !D.p) {
    document.getElementById('titulo').textContent = 'Enlace incompleto';
    document.getElementById('lista').innerHTML = '<p class="error">Este enlace no trae la lista de productos. Pide que te lo vuelvan a mandar. Si lo abriste dentro de otra aplicación, ábrelo en Chrome.</p>';
    return;
  }
  CLAVE = 'precios:' + D.p.map(p => p[0]).join(',').slice(0, 400);
  cargar();
  document.getElementById('titulo').textContent = D.t;
  document.getElementById('saludo').textContent = 'Hola' + (D.q ? ' ' + D.q : '') + ' 👋 Escribe a cuánto vendes cada uno. Lo que no sepas, déjalo vacío.';
  ['busca', 'mandar', 'nota'].forEach(i => document.getElementById(i).style.display = 'block');
  document.getElementById('busca').oninput = pintar;
  document.getElementById('mandar').onclick = mandar;
  pintar();
})();
</script>
</body>
</html>
